<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteos | Imperio Gamer</title>
<meta name="description" content="Resultados de los sorteos de Imperio Gamer: cruces, equipos y ganadores.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/torneos/img/favicon.png">
<meta property="og:title" content="Sorteos | Imperio Gamer">
<meta property="og:description" content="Mirá en vivo los cruces, equipos y ganadores de cada sorteo.">
<meta property="og:image" content="https://imperio-gamer.vercel.app/torneos/img/og.jpg">
<link rel="preload" href="/torneos/fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/torneos/estilos.css">
</head>
<body>
<div class="envoltura llaves-pagina">
  <div class="barra"><a href="/torneos">Ver los torneos</a></div>
  <h1>Sorteos</h1>
  <div class="pestanas" id="pestanas" role="tablist" aria-label="Juego"></div>
  <h2 class="s-titulo" id="titulo"></h2>
  <p class="llave-info" id="info"></p>
  <div id="resultado" aria-live="polite"></div>
  <p class="llave-pie" id="pie"></p>
</div>
<script type="module">
import { JUEGOS, htmlResultado, resumen } from "/torneos/sorteo/sorteo.js";
import { crearRuleta } from "/torneos/sorteo/ruleta.js";

const $ = (id) => document.getElementById(id);
const hora = (v) => new Date(v).toLocaleTimeString("es-AR", { timeZone: "America/Argentina/Buenos_Aires", hour: "2-digit", minute: "2-digit", hour12: false });
let sorteos = {};
let elegido = new URLSearchParams(location.search).get("j");
let firma = "";
let vistos = null;
let girando = false;
let pendiente = null;
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const sinMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;

function pintar(animar = false) {
  // Mientras gira la ruleta no se redibuja; el cambio se muestra al terminar.
  if (girando) {
    pendiente = pendiente || animar;
    return;
  }
  const disponibles = JUEGOS.filter((j) => sorteos[j.id]);
  if (!disponibles.length) {
    $("pestanas").innerHTML = "";
    $("titulo").textContent = "";
    $("info").textContent = "Todavía no hay sorteos publicados. Esta página se actualiza sola.";
    $("resultado").innerHTML = "";
    $("pie").textContent = "";
    return;
  }
  if (!disponibles.some((j) => j.id === elegido)) elegido = disponibles[0].id;
  $("pestanas").innerHTML = disponibles
    .map((j) => `<button type="button" role="tab" data-j="${j.id}" aria-selected="${j.id === elegido}">${j.id === "otro" ? "Otro" : j.nombre}</button>`)
    .join("");
  const s = sorteos[elegido];
  $("titulo").textContent = s.datos.titulo;
  $("info").textContent = resumen(s.datos);
  if (s.datos.modo === "ganadores") {
    $("resultado").classList.remove("animar");
    $("resultado").innerHTML = `<div class="s-premios">
      <div class="ruleta">
        <div class="ruleta-rueda"><canvas id="rueda" aria-hidden="true"></canvas><span class="ruleta-flecha" aria-hidden="true"></span></div>
        <p class="ruleta-nombre" id="rueda-nombre" aria-hidden="true"></p>
        <button class="boton borde" type="button" id="repetir">Girar de nuevo</button>
      </div>
      <div>${htmlResultado(s.datos)}</div>
    </div>`;
    prepararRuleta(s.datos, animar);
  } else {
    $("resultado").innerHTML = htmlResultado(s.datos);
    $("resultado").classList.toggle("animar", animar);
  }
  $("pie").textContent = `Sorteado a las ${hora(s.actualizado)}. La página se actualiza sola.`;
}

// "Girar de nuevo" repite la animación con los mismos ganadores: no vuelve a sortear.
function prepararRuleta(d, animar) {
  const rueda = crearRuleta($("rueda"), $("rueda-nombre"));
  const items = [...document.querySelectorAll(".s-ganadores li")];
  const ganadores = d.resultado.ganadores;

  function fijo() {
    rueda.nombres(d.nombres);
    rueda.apuntar(ganadores[0]);
    items.forEach((li) => (li.hidden = false));
  }

  async function girar() {
    if (girando || !ganadores.length) return;
    girando = true;
    $("repetir").disabled = true;
    items.forEach((li) => (li.hidden = true));
    let quedan = [...d.nombres];
    const ms = ganadores.length > 3 ? 3500 : 6000;
    for (const [i, g] of ganadores.entries()) {
      rueda.nombres(quedan);
      await rueda.girarA(g, ms);
      items[i].hidden = false;
      items[i].classList.add("recien");
      await espera(1200);
      quedan = quedan.filter((n) => n !== g);
    }
    rueda.nombres(d.nombres);
    rueda.apuntar(ganadores[0]);
    girando = false;
    if (document.getElementById("repetir")) $("repetir").disabled = false;
    if (pendiente !== null) {
      const a = pendiente;
      pendiente = null;
      pintar(a);
    }
  }

  $("repetir").addEventListener("click", girar);
  if (animar && !sinMovimiento) girar();
  else fijo();
}

async function cargar() {
  try {
    const r = await fetch("/api/sorteos", { cache: "no-store" });
    if (!r.ok) throw new Error();
    const d = await r.json();
    const nueva = JSON.stringify(d.sorteos);
    if (nueva === firma) return;
    firma = nueva;
    const antes = vistos;
    sorteos = d.sorteos;
    vistos = Object.fromEntries(Object.entries(sorteos).map(([k, v]) => [k, v.actualizado]));
    // Si llega un sorteo nuevo mientras la página está abierta, se muestra ese y se revela de a uno.
    const nuevo = antes && Object.keys(vistos).find((k) => vistos[k] !== antes[k]);
    if (nuevo) elegido = nuevo;
    pintar(Boolean(nuevo));
  } catch {
    if (!firma) $("info").textContent = "No se pudieron cargar los sorteos. Recargá la página en unos minutos.";
  }
}

$("pestanas").addEventListener("click", (e) => {
  const b = e.target.closest("[data-j]");
  if (!b) return;
  elegido = b.dataset.j;
  history.replaceState(null, "", `?j=${elegido}`);
  pintar();
});

cargar();
setInterval(cargar, 5000);
</script>
</body>
</html>
